<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Card Scout — Pokémon TCG</title>
<style>
  :root{
    --bg: #10131a;
    --panel: #171b24;
    --panel-2: #1e2330;
    --line: #2a3040;
    --ink: #eef0f4;
    --ink-dim: #8b93a7;
    --holo1: #ffd76b;
    --holo2: #7ee0d0;
    --holo3: #c58bff;
    --good: #5fd98a;
    --mid: #f2c94c;
    --bad: #ef6461;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 100px;
    -webkit-tap-highlight-color: transparent;
  }
  header{
    padding: 22px 18px 16px;
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .brand .mark{
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--holo1), var(--holo2), var(--holo3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 700;
  }
  h1{ font-size: 21px; margin: 4px 0 2px; font-weight: 700; }
  .sub{ color: var(--ink-dim); font-size: 13px; }

  .tabs{ display:flex; gap:6px; margin: 14px 18px 0; }
  .tab{
    flex:1; text-align:center; padding: 10px 4px; border-radius: 10px;
    background: var(--panel); color: var(--ink-dim); font-size: 12.5px; font-weight:600;
    border: 1px solid var(--line);
  }
  .tab.active{ background: var(--panel-2); color: var(--ink); border-color: #3a4256; }

  main{ padding: 16px 18px; }
  section{ display:none; }
  section.active{ display:block; }

  .card-panel{
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }

  label{ display:block; font-size: 12px; color: var(--ink-dim); margin: 12px 0 6px; }
  label:first-child{ margin-top: 0; }
  input[type=text], input[type=number], select{
    width: 100%; padding: 12px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); font-size: 15px;
  }
  input:focus, select:focus{ outline: none; border-color: var(--holo2); }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checkrow{ display:flex; align-items:center; gap: 8px; margin-top: 14px; }
  .checkrow input{ width: 18px; height: 18px; }
  .checkrow label{ margin: 0; color: var(--ink); font-size: 14px; }

  .more-toggle{
    margin-top: 16px; padding: 10px; text-align: center; border-radius: 10px;
    background: transparent; border: 1px dashed var(--line); color: var(--ink-dim);
    font-size: 13px;
  }
  .more{ display:none; }
  .more.open{ display:block; }

  .btn{
    display:block; width:100%; text-align:center; padding: 14px; margin-top: 16px;
    border-radius: 10px; border: none; font-weight: 700; font-size: 15px;
    background: linear-gradient(90deg, var(--holo1), var(--holo2));
    color: #10131a;
  }
  .btn.secondary{
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); font-weight: 600;
  }

  .empty{ text-align:center; color: var(--ink-dim); padding: 60px 20px; font-size: 14px; line-height:1.6; }

  .list-item{
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px;
  }
  .li-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .li-name{ font-weight: 700; font-size: 15px; }
  .li-meta{ color: var(--ink-dim); font-size: 12px; margin-top: 2px; }
  .score-badge{
    flex-shrink:0; min-width: 46px; text-align:center; padding: 6px 8px; border-radius: 8px;
    font-weight: 800; font-size: 15px;
  }
  .score-good{ background: rgba(95,217,138,0.15); color: var(--good); }
  .score-mid{ background: rgba(242,201,76,0.15); color: var(--mid); }
  .score-bad{ background: rgba(239,100,97,0.15); color: var(--bad); }

  .verdict{ font-size: 12px; margin-top: 8px; font-weight: 600; }
  .driver-line{ font-size: 11px; color: var(--ink-dim); margin-top: 4px; }
  .target-price{
    font-size: 12.5px; margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  }
  .target-price b{ color: var(--holo2); }
  .confidence-badge{
    display:inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 20px;
    margin-top: 6px; font-weight: 700;
  }
  .conf-high{ background: rgba(95,217,138,0.15); color: var(--good); }
  .conf-mid{ background: rgba(242,201,76,0.15); color: var(--mid); }
  .conf-low{ background: rgba(239,100,97,0.15); color: var(--bad); }
  .bars{ display:flex; gap: 4px; margin-top: 10px; }
  .bar{ flex:1; height: 5px; border-radius: 3px; background: var(--panel-2); overflow:hidden; }
  .bar i{ display:block; height:100%; background: linear-gradient(90deg, var(--holo3), var(--holo2)); }
  .bar-labels{ display:flex; gap:4px; margin-top: 4px; }
  .bar-labels span{ flex:1; text-align:center; font-size: 9px; color: var(--ink-dim); }

  .li-actions{ display:flex; gap: 8px; margin-top: 12px; }
  .li-actions button{
    flex:1; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink-dim); font-size: 12px; font-weight: 600;
  }
  .li-actions button.primary{ background: linear-gradient(90deg, var(--holo3), var(--holo2)); color:#10131a; border-color:transparent; }
  .notes{ font-size: 11px; color: var(--ink-dim); margin-top: 8px; line-height: 1.5; display:none; }
  .notes.open{ display:block; }

  .footer-actions{
    position: fixed; bottom: 0; left:0; right:0;
    background: linear-gradient(0deg, var(--bg) 60%, transparent);
    padding: 16px 18px 20px; display:flex; gap: 10px;
  }
  .footer-actions button{
    flex:1; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-dim); font-size: 12px; font-weight: 600;
  }
  #fileImport{ display:none; }

  .pill{
    display:inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px;
    background: var(--panel-2); color: var(--ink-dim); margin-right: 6px; margin-top: 6px;
    border: 1px solid var(--line);
  }
  .rarity-quick{ display:flex; gap:8px; flex-wrap:wrap; margin-top: 6px; }
  .rq-btn{
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 700;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
  }
  .rq-btn.selected{ background: linear-gradient(90deg, var(--holo3), var(--holo2)); color: #10131a; border-color: transparent; }

  /* Séries tab */
  .set-search-row{ display:flex; gap:8px; }
  .set-search-row input{ flex:1; }
  .set-search-row button{
    padding: 0 16px; border-radius: 10px; border:none; font-weight:700;
    background: linear-gradient(90deg, var(--holo1), var(--holo2)); color:#10131a;
  }
  .set-item{
    display:flex; align-items:center; gap: 12px; padding: 12px; border-radius: 12px;
    background: var(--panel); border:1px solid var(--line); margin-bottom: 8px;
  }
  .set-item img{ width: 36px; height:36px; object-fit:contain; }
  .set-logo-fallback{
    width: 36px; height: 36px; border-radius: 8px; flex-shrink:0;
    background: linear-gradient(135deg, var(--holo3), var(--holo2));
    color: #10131a; font-weight: 800; font-size: 15px;
    display:flex; align-items:center; justify-content:center;
  }
  .set-item .si-name{ font-weight:700; font-size:14px; }
  .set-item .si-meta{ color:var(--ink-dim); font-size:11px; margin-top:2px; }
  .card-thumb-fallback{
    width: 44px; min-height: 44px; border-radius: 6px; flex-shrink:0;
    background: var(--panel-2); border: 1px dashed var(--line);
    color: var(--ink-dim); font-size: 8px; text-align:center; line-height:1.3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 2px; overflow:hidden; text-decoration:none;
  }
  .status-msg{ text-align:center; color: var(--ink-dim); font-size: 13px; padding: 20px 10px; }
  .scan-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .scan-header button{
    background:none; border:none; color:var(--holo2); font-size:13px; font-weight:600;
  }
  .toggle-all{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim); margin-bottom: 10px;
  }
  .card-thumb{ width:44px; height:auto; border-radius:6px; flex-shrink:0; }
  .card-thumb.zoomable{ cursor: pointer; }
  .lightbox{
    position: fixed; inset: 0; background: rgba(8,10,14,0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  .lightbox.open{ display: flex; }
  .lightbox img{ max-width: 100%; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .lightbox-close{
    position: absolute; top: 18px; right: 18px; width: 40px; height: 40px;
    border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink); font-size: 18px; display:flex; align-items:center; justify-content:center;
  }
  .li-top-scan{ display:flex; gap:10px; align-items:flex-start; }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">La Réserve TCG</span></div>
  <h1>Card Scout <span style="font-size:12px;font-weight:400;color:var(--ink-dim);">v1.16 (FR)</span></h1>
  <div class="sub">Score d'investissement AR / SAR — FR · JP · EN</div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="scan">Scanner une série</div>
  <div class="tab" data-tab="add">+ Manuel</div>
  <div class="tab" data-tab="list">Ma liste</div>
</div>

<main>

  <!-- ===================== SCAN TAB ===================== -->
  <section id="tab-scan" class="active">
    <div class="card-panel">
      <label>Chercher une série</label>
      <div class="set-search-row">
        <input type="text" id="set-search" placeholder="ex: Évolutions Prismées, sv4a...">
        <button id="btn-set-search">OK</button>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="set-only-interesting" checked>
        <label for="set-only-interesting">Uniquement les raretés chase (AR/SR/SAR/UR/SSR/MUR...)</label>
      </div>

      <label style="margin-top:18px;">Ou chercher un Pokémon (toutes séries confondues)</label>
      <div class="set-search-row">
        <input type="text" id="pokemon-search" placeholder="ex: Dracaufeu, Charizard...">
        <button id="btn-pokemon-search">OK</button>
      </div>
    </div>

    <div id="set-results"></div>
    <div id="scan-results"></div>
  </section>

  <!-- ===================== MANUAL ADD TAB ===================== -->
  <section id="tab-add">
    <div class="card-panel">
      <label>Nom de la carte</label>
      <input type="text" id="f-name" placeholder="ex: Charizard ex">

      <label>Rareté</label>
      <div class="rarity-quick" id="rarity-quick">
        <div class="rq-btn" data-r="AR">AR</div>
        <div class="rq-btn" data-r="SR">SR</div>
        <div class="rq-btn" data-r="SAR">SAR</div>
        <div class="rq-btn" data-r="SSR">SSR</div>
        <div class="rq-btn" data-r="UR">UR</div>
        <div class="rq-btn" data-r="MUR">MUR</div>
        <div class="rq-btn" data-r="Alt Art">Alt Art (EN)</div>
        <div class="rq-btn" data-r="Promo">Promo</div>
        <div class="rq-btn" data-r="Autre">Autre</div>
      </div>

      <div class="row2">
        <div>
          <label>Marché</label>
          <select id="f-market">
            <option value="JP">JP</option>
            <option value="FR">FR</option>
            <option value="EN">EN</option>
          </select>
        </div>
        <div>
          <label>Set / code</label>
          <input type="text" id="f-set" placeholder="ex: sv4a">
        </div>
      </div>

      <label>Personnage</label>
      <select id="f-character"></select>

      <label>Illustrateur</label>
      <select id="f-artist"></select>

      <div class="checkrow">
        <input type="checkbox" id="f-anniv">
        <label for="f-anniv">Set anniversaire (25th / 30th...)</label>
      </div>
      <div class="checkrow">
        <input type="checkbox" id="f-reprint">
        <label for="f-reprint">Déjà réimprimée</label>
      </div>

      <div class="more-toggle" id="more-toggle">+ Détails avancés (rareté chiffrée, PSA, prix)</div>

      <div class="more" id="more-fields">
        <label>Pull rate (probabilité par booster, en %)</label>
        <input type="number" step="0.01" id="f-pullrate" placeholder="ex: 0.5">

        <div class="row2">
          <div>
            <label>PSA pop totale (si tu l'as)</label>
            <input type="number" id="f-psatotal" placeholder="ex: 850">
          </div>
          <div>
            <label>PSA pop 10 (si tu l'as)</label>
            <input type="number" id="f-psa10" placeholder="ex: 60">
          </div>
        </div>

        <div class="row2">
          <div>
            <label>Prix actuel (€)</label>
            <input type="number" step="0.01" id="f-pricenow" placeholder="ex: 220">
          </div>
          <div>
            <label>Prix moyen référence (€)</label>
            <input type="number" step="0.01" id="f-price1y" placeholder="ex: 260">
          </div>
        </div>

        <label>Prix le plus bas observé (€) -- sert d'indice gratuit si pas de pop PSA</label>
        <input type="number" step="0.01" id="f-pricelow" placeholder="ex: 190">

        <label>Ventes réelles sur 90 jours</label>
        <input type="number" id="f-sales90" placeholder="ex: 90">
      </div>

      <button class="btn" id="btn-add">Scorer et ajouter à ma liste</button>
    </div>
  </section>

  <!-- ===================== LIST TAB ===================== -->
  <section id="tab-list">
    <div id="list-container"></div>
  </section>

</main>

<div class="lightbox" id="lightbox">
  <div class="lightbox-close" id="lightbox-close">✕</div>
  <img id="lightbox-img" src="" alt="">
</div>

<div class="footer-actions">
  <button id="btn-export">Exporter</button>
  <button id="btn-import">Importer</button>
  <input type="file" id="fileImport" accept="application/json">
</div>

<script>
/* ============================================================
   Référentiels tiers (portés depuis card_scout Python)
   ============================================================ */
const CHARACTER_TIERS = {
  "charizard": 1, "pikachu": 1, "mew": 1, "umbreon": 1, "mewtwo": 1,
  "rayquaza": 2, "gengar": 2, "eevee": 2, "lugia": 2, "sylveon": 2,
  "greninja": 2, "lucario": 2, "dragapult": 2, "ho-oh": 2, "suicune": 2,
  "espeon": 2, "vaporeon": 2, "glaceon": 2, "flareon": 2, "jolteon": 2, "leafeon": 2,
  "zacian": 2, "zamazenta": 2, "miraidon": 2, "koraidon": 2, "terapagos": 2,
  "blastoise": 3, "venusaur": 3, "snorlax": 3, "entei": 3, "arceus": 2, "giratina": 2,
  // Alias FR des mêmes personnages -- uniquement ceux dont le nom diffère
  // réellement de l'anglais (Pikachu, Mew, Rayquaza... sont identiques en
  // FR donc déjà couverts). Sans ça, le filet de secours (quand pas de
  // cohorte de prix comparable) échouait silencieusement sur les noms
  // français, causant des scores incohérents pour la MÊME carte selon
  // qu'elle soit trouvée via un scan de set ou une recherche par nom.
  "dracaufeu": 1, "noctali": 1,
  "ectoplasma": 2, "évoli": 2, "nymphali": 2, "amphinobi": 2, "dragapulse": 2,
  "mentali": 2, "aquali": 2, "givrali": 2, "pyroli": 2, "voltali": 2, "phyllali": 2,
  "tortank": 3, "florizarre": 3, "ronflex": 3
};
const TRAINER_TIERS = {
  "iono": 1, "nanjamo": 1, "team rocket": 1, "cynthia": 1,
  "lillie": 2, "marnie": 2, "geeta": 2
};
const ARTIST_TIERS = {
  "mitsuhiro arita": 1, "planet": 1, "kagemaru himeno": 1, "sowsow": 1,
  "5ban graphics": 2, "naoyo kimura": 2, "saya tsuruta": 2, "kouki saitou": 2, "mizue": 2
};
const TIER_LABEL = {1:"Tier 1 — top", 2:"Tier 2", 3:"Tier 3 (neutre)", 4:"Tier 4", 5:"Tier 5 — faible"};
const CHARACTER_TIERS_SELECT = Object.assign({"autre / non listé":3}, CHARACTER_TIERS, TRAINER_TIERS);
const ARTIST_TIERS_SELECT = Object.assign({"autre / non listé":3}, ARTIST_TIERS);

function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
// Matching par MOT ENTIER (pas un simple .includes()), clés les plus
// longues testées en premier. Le \b regex classique ne gère PAS bien les
// caractères accentués en JS (ex: "évoli" -- \b peut échouer à détecter
// une frontière de mot correcte autour du "é"), donc la frontière est
// vérifiée manuellement avec une classe incluant les lettres accentuées.
const WORD_CHAR_RE = /[a-zà-öø-ÿ0-9]/i;
function findTier(text, dict){
  const n = (text||"").toLowerCase();
  const keys = Object.keys(dict).sort((a,b)=> b.length - a.length);
  for(const key of keys){
    const k = key.trim().toLowerCase();
    const idx = n.indexOf(k);
    if(idx === -1) continue;
    const before = idx > 0 ? n[idx-1] : "";
    const after = idx + k.length < n.length ? n[idx+k.length] : "";
    if(!WORD_CHAR_RE.test(before) && !WORD_CHAR_RE.test(after)){
      return {name:key.trim(), tier:dict[key], known:true};
    }
  }
  return null;
}

// Un perso/artiste absent de nos listes n'est pas forcément "faible" -- on ne
// le sait juste pas. On lui donne un tier 3 neutre plutôt que le pire tier,
// pour ne pas plomber artificiellement le score des cartes récentes.
function tierForCharacter(cardName){
  return findTier(cardName, TRAINER_TIERS) || findTier(cardName, CHARACTER_TIERS) || {name: cardName, tier: 3, known:false};
}
function tierForArtist(artistName){
  if(!artistName || !artistName.trim()) return {name:"", tier:3, known:false};
  return findTier(artistName, ARTIST_TIERS) || {name: artistName, tier: 3, known:false};
}

/* ============================================================
   Config / poids (identique à config.py)
   ============================================================ */
// Poids des piliers STRUCTURELS (hors demande) -- doivent sommer à 1.0
// Poids revus : la liquidité pesait autant que la rareté, ce qui pouvait
// faire remonter une carte commune (donc très échangée -> prix stable ->
// "liquide") presque autant qu'une carte rare et prisée. Pour un objectif
// d'achat et de conservation LONGUE, la liquidité compte surtout au moment
// de la revente future, pas pendant la détention -- elle pèse donc moins
// que la rareté et la rareté de marché ici.
const STRUCT_WEIGHTS = { rarity:0.35, pop_scarcity:0.25, liquidity:0.15, timing:0.25 };
// La demande (personnage + artiste) n'est PAS un terme pondéré de plus --
// c'est un MULTIPLICATEUR appliqué au score structurel. Un test contre de
// vrais prix (Eternatus VMAX Rainbow $10 vs Charizard VMAX Rainbow $150-400,
// MÊME rareté exacte) a montré qu'un simple weighted-average ne pouvait
// jamais représenter un tel écart, même avec un poids "demande" élevé --
// la demande agit multiplicativement sur le marché réel, pas additivement.
// tier1 (perso vedette) -> x2.0 ; neutre (perso inconnu) -> x1.0 environ ;
// tier5 (perso boudé) -> x0.3
const DEMAND_MULTIPLIER_MIN = 0.3;
// Réduit de 2.0 -> 1.3 : avec 2.0, une carte de rareté chase (déjà notée
// haut sur le pilier Rareté) + une demande seulement correcte (7/10, pas
// exceptionnelle) dépassait déjà 10 et se faisait plafonner -- résultat :
// la majorité des cartes rares affichaient 10, plus aucune différenciation
// (constaté en usage réel). Avec 1.3, il faut une carte VRAIMENT complète
// sur tous les piliers pour atteindre 10 -- le score redevient un vrai tri.
const DEMAND_MULTIPLIER_MAX = 1.3;
const PULL_RATE_BUCKETS = [[0.002,10],[0.005,8],[0.01,6],[0.02,4],[0.05,2],[Infinity,1]];
const PSA_RATIO_BUCKETS = [[0.05,10],[0.10,8],[0.20,6],[0.35,4],[0.55,2],[Infinity,1]];
// Pas d'API PSA gratuite accessible sans backend (voir notes) -- à défaut,
// on calcule un indice de DISPERSION DE PRIX à partir des données Cardmarket
// déjà récupérées gratuitement (prix le plus bas vs prix courant). Un grand
// écart suggère un marché fin/peu liquide (peu de copies en circulation à
// prix cohérent) -- ce n'est PAS équivalent à une vraie pop PSA, c'est une
// approximation, indiquée comme telle dans les notes.
const PRICE_SPREAD_BUCKETS = [[0.05,2],[0.15,4],[0.30,6],[0.50,8],[Infinity,10]];
const TIER_TO_SCORE = {1:10,2:8,3:5,4:3,5:1};
const ANNIVERSARY_BONUS = 1.5;
const SALES_VOLUME_BUCKETS = [[5,1],[15,3],[40,5],[100,7],[250,9],[Infinity,10]];
// Liquidité réelle et gratuite : volatilité du prix jour (avg1) vs mois
// (avg30), toutes deux déjà fournies par Cardmarket via TCGdex. Un marché
// avec beaucoup de ventes fait converger avg1 vers avg30 (chaque vente pèse
// peu sur la moyenne) ; un marché avec 1-2 ventes/mois fait bondir avg1 à
// chaque transaction -> grand écart = marché fin/peu liquide.
const LIQUIDITY_VOLATILITY_BUCKETS = [[0.05,10],[0.15,8],[0.30,6],[0.50,4],[Infinity,2]];
const VERDICT_BUCKETS = [[8.0,"FORT POTENTIEL — étudier un achat"],[6.5,"INTÉRESSANT — à surveiller"],[5.0,"NEUTRE — pas prioritaire"],[0,"FAIBLE — éviter"]];

// Score de rareté déduit du LIBELLÉ affiché sur la carte, utilisé quand on
// n'a pas de pull rate chiffré (cas du scan automatique). Basé sur la
// hiérarchie de rareté généralement admise sur le marché EN/JP (2026).
// Inclut les codes courts JP tels qu'imprimés sur la carte (AR, SR, SAR, UR,
// SSR, MUR) en plus des libellés EN traduits -- un test contre des prix
// réels a montré que sans ça, "AR"/"SR"/"SAR" bruts (format JP) ne
// matchaient RIEN et retombaient en score neutre.
const RARITY_LABEL_SCORE = {
  "mur": 10, "special illustration rare": 10, "ssr": 9, "sar": 9,
  "special art rare": 9, "character super rare": 9,
  "hyper rare": 9, "secret rare": 8, "gold rare": 8,
  "black white rare": 8, "ur": 8,
  "character rare": 7, "shiny ultra rare": 7, "ace spec rare": 7, "sr": 7,
  "illustration rare": 6, "ultra rare": 6, "amazing rare": 6, "radiant rare": 6,
  "art rare": 6, "ar": 6, "trainer gallery rare holo": 6,
  // "Rainbow Rare" recalibré 8->6 : contrairement à SAR/Hyper Rare (peu de
  // cartes par set), quasi CHAQUE Pokémon V/VMAX/VSTAR d'un set EN a sa
  // propre Rainbow Rare -- ce n'est pas un tirage limité, la rareté du
  // palier ne veut presque rien dire seule. Test réel : Eternatus VMAX
  // Rainbow Rare (2020) ~10-11$ vs Charizard VMAX Rainbow Rare (même set,
  // même rareté) 150-400$+ -- l'écart est à 95% une question de personnage.
  "rainbow rare": 6,
  "double rare": 5, "rare holo v": 4, "rare holo vmax": 4, "rare holo vstar": 4,
  "rare holo ex": 4, "rare holo gx": 4, "rare holo": 3, "rare": 2, "uncommon": 1, "common": 1
};
function rarityLabelScore(label){
  if(!label) return null;
  const l = label.toLowerCase();
  if(RARITY_LABEL_SCORE[l] !== undefined) return RARITY_LABEL_SCORE[l];
  for(const key in RARITY_LABEL_SCORE){ if(l.includes(key)) return RARITY_LABEL_SCORE[key]; }
  return null;
}

function bucketScore(value, buckets){
  for(const [t,s] of buckets){ if(value < t) return s; }
  return buckets[buckets.length-1][1];
}
function getVerdict(score){
  for(const [t,label] of VERDICT_BUCKETS){ if(score >= t) return label; }
  return VERDICT_BUCKETS[VERDICT_BUCKETS.length-1][1];
}
function round1(n){ return Math.round(n*10)/10; }

// ============================================================
// Prix cible -- basé sur des taux d'appréciation RÉELS documentés
// (Card Ladder Pokémon Index, PWCC Top 500), PAS une régression sur les
// données de la carte elle-même (on n'a pas d'historique de prix, juste un
// instantané). Sources : Card Ladder ~15-25% CAGR marché large sur cycle
// 2018-2023 (hors pics spéculatifs 2021/2026) ; les cartes "star" (top
// tier, personnage+rareté forts) captent l'essentiel des gains -- la
// majorité des cartes mid-tier stagnent ou baissent en valeur réelle.
// Affiché sur PLUSIEURS horizons (1/3/5 ans) -- pas de 10 ans : au-delà de
// 5 ans l'incertitude (réimpressions, mode, nouveaux sets) rend une
// fourchette chiffrée plus trompeuse qu'utile.
const TARGET_CAGR_BY_VERDICT = {
  "FORT POTENTIEL — étudier un achat": [0.15, 0.35],
  "INTÉRESSANT — à surveiller": [0.08, 0.20],
  "NEUTRE — pas prioritaire": [0.00, 0.10],
  "FAIBLE — éviter": [-0.12, 0.03]
};
const TARGET_HORIZONS = [1, 3, 5];

function estimateTargetPrices(verdictLabel, priceNow){
  if(!priceNow || priceNow <= 0) return null;
  const [lowCagr, highCagr] = TARGET_CAGR_BY_VERDICT[verdictLabel] || [0, 0.08];
  return TARGET_HORIZONS.map(years => {
    const lowMult = Math.pow(1 + lowCagr, years);
    const highMult = Math.pow(1 + highCagr, years);
    return {
      years,
      low: round1(priceNow * lowMult), high: round1(priceNow * highMult),
      pctLow: Math.round((lowMult - 1) * 100), pctHigh: Math.round((highMult - 1) * 100)
    };
  });
}

/* ============================================================
   Scoring engine (port de scoring.py)
   ============================================================ */
// Demande calculée par PRIX RÉEL : classe chaque carte par percentile de
// prix parmi les autres cartes de MÊME rareté dans le même scan. C'est
// exactement le signal qui manquait pour distinguer un Double Rare cher
// d'un Double Rare bon marché, ou un SAR "juste prix" d'un SAR encore
// sous-coté -- sans dépendre d'une liste perso/artiste jamais exhaustive.
// Nécessite au moins 4 cartes comparables (même rareté + prix connu) dans
// le scan ; sinon on ne l'utilise pas (pas assez fiable statistiquement).
function applyDemandCohorts(results){
  const groups = {};
  results.forEach((r, idx) => {
    const rarity = (r.rarityLabel || "").toLowerCase().trim();
    if(!rarity) return;
    // Clé = set + rareté : comparer le prix d'une SAR d'un set à une SAR
    // d'un AUTRE set n'a aucun sens (bases de prix totalement différentes).
    // C'était le bug : une recherche par nom de Pokémon (qui mélange les
    // sets) donnait un score de demande incohérent avec un scan du même
    // set pris isolément, pour la MÊME carte.
    const key = (r.setCode || "") + "|" + rarity;
    (groups[key] = groups[key] || []).push(idx);
  });
  Object.values(groups).forEach(idxs => {
    const withPrice = idxs.filter(i => results[i].priceNow && results[i].priceNow > 0);
    if(withPrice.length < 4) return;
    const sorted = [...withPrice].sort((a,b) => results[a].priceNow - results[b].priceNow);
    sorted.forEach((idx, rank) => {
      const percentile = sorted.length > 1 ? rank / (sorted.length - 1) : 0.5;
      results[idx].demandCohortScore = round1(1 + percentile * 9);
      results[idx].demandCohortSize = withPrice.length;
    });
  });
}

function scoreCard(c){
  const notes = [];
  let s;
  const real = { rarity:false, pop:false, demand:false, liquidity:false, timing:false };

  if(c.pullRate !== null && c.pullRate !== undefined && c.pullRate !== ""){
    s = bucketScore(c.pullRate/100, PULL_RATE_BUCKETS);
    real.rarity = true;
  } else {
    const labelScore = rarityLabelScore(c.rarityLabel);
    if(labelScore !== null){
      s = labelScore;
      real.rarity = true;
      notes.push(`Rareté : estimée depuis le libellé "${c.rarityLabel}" (pas de pull rate chiffré)`);
    } else {
      notes.push("Rareté : pull rate et libellé inconnus -> score neutre"); s = 5;
    }
  }
  if(c.reprinted === true){ s = Math.max(1, s-3); notes.push("Rareté : déjà réimprimée -> malus"); }
  const scoreRarity = Math.min(s, 10);

  let scorePop;
  if(c.psaTotal && c.psa10 !== null && c.psa10 !== undefined && c.psaTotal > 0){
    const ratio = c.psa10 / c.psaTotal;
    scorePop = bucketScore(ratio, PSA_RATIO_BUCKETS);
    real.pop = true;
    if(c.psaTotal < 200) notes.push("Pop PSA faible en volume -> ratio peu fiable (set récent ?)");
  } else if(c.priceNow && c.priceLow && c.priceNow > 0){
    // Pas de pop PSA (pas d'API gratuite dispo) -- proxy gratuit via
    // Cardmarket : écart entre prix le plus bas et prix courant.
    const spread = (c.priceNow - c.priceLow) / c.priceNow;
    scorePop = bucketScore(Math.max(0, spread), PRICE_SPREAD_BUCKETS);
    real.pop = true;
    notes.push(`Rareté marché : estimée via dispersion de prix Cardmarket (${Math.round(spread*100)}% d'écart) -- pas une vraie pop PSA, à prendre comme indice approximatif`);
  } else { notes.push("Rareté marché : aucune donnée (ni PSA, ni prix Cardmarket) -> score neutre"); scorePop = 5; }

  let scoreDemand;
  if(c.demandCohortScore !== null && c.demandCohortScore !== undefined){
    scoreDemand = c.demandCohortScore;
    real.demand = true;
    notes.push(`Demande : calculée par rang de prix réel parmi ${c.demandCohortSize} carte(s) de même rareté dans ce scan (percentile) -- donnée mesurée, pas une estimation`);
  } else {
    const charScore = TIER_TO_SCORE[c.characterTier] ?? 5;
    const artistScore = TIER_TO_SCORE[c.artistTier] ?? 5;
    if(c.characterKnown) real.demand = true;
    if(c.characterKnown === false){
      notes.push(`Demande : personnage "${c.characterName || c.name}" non reconnu et pas assez de cartes comparables pour un calcul par les prix -> estimation neutre (5/10)`);
    }
    if(c.artistKnown === false && c.artistName){
      notes.push(`Demande : illustrateur "${c.artistName}" non reconnu -> composant neutre (5/10)`);
    }
    scoreDemand = (charScore + artistScore) / 2;
  }
  if(c.anniversary){ scoreDemand = Math.min(scoreDemand + ANNIVERSARY_BONUS, 10); notes.push("Demande : set anniversaire -> bonus"); }
  scoreDemand = Math.min(scoreDemand, 10);

  let scoreLiq;
  if(c.sales90 !== null && c.sales90 !== undefined && c.sales90 !== ""){
    scoreLiq = bucketScore(c.sales90, SALES_VOLUME_BUCKETS);
    real.liquidity = true;
  } else if(c.priceAvg1 && c.price1y && c.price1y > 0){
    const volatility = Math.abs(c.priceAvg1 - c.price1y) / c.price1y;
    scoreLiq = bucketScore(volatility, LIQUIDITY_VOLATILITY_BUCKETS);
    real.liquidity = true;
    notes.push(`Liquidité : calculée via volatilité prix jour/mois Cardmarket (${Math.round(volatility*100)}% d'écart) -- pas un vrai volume de ventes, mais un vrai calcul, pas une estimation forfaitaire`);
  } else { notes.push("Liquidité : aucune donnée exploitable -> score neutre"); scoreLiq = 5; }

  let scoreTiming;
  if(c.priceNow && c.price1y){
    const ratio = c.priceNow / c.price1y;
    real.timing = true;
    if(ratio <= 0.85) scoreTiming = 10;
    else if(ratio <= 0.95) scoreTiming = 8;
    else if(ratio <= 1.05) scoreTiming = 6;
    else if(ratio <= 1.20) scoreTiming = 4;
    else { scoreTiming = 2; notes.push("Timing : prix bien au-dessus de la référence -> prudence FOMO"); }
    if(c.priceIsShortTermProxy) notes.push("Timing : comparaison basée sur la tendance 30j (API), pas 1 an complet");
  } else { notes.push("Timing : historique de prix insuffisant -> score neutre"); scoreTiming = 5; }

  const structural = scoreRarity*STRUCT_WEIGHTS.rarity + scorePop*STRUCT_WEIGHTS.pop_scarcity
                    + scoreLiq*STRUCT_WEIGHTS.liquidity + scoreTiming*STRUCT_WEIGHTS.timing;
  const demandMultiplier = DEMAND_MULTIPLIER_MIN + ((scoreDemand - 1) / 9) * (DEMAND_MULTIPLIER_MAX - DEMAND_MULTIPLIER_MIN);
  const rawTotal = Math.min(10, structural * demandMultiplier);

  const realCount = Object.values(real).filter(Boolean).length;
  let confidence = Math.round((realCount / 5) * 100);

  // La confiance ne se contente plus d'être affichée à côté -- elle
  // RÉDUIT mathématiquement le score final. Un 10/10 calculé à partir de
  // piliers en grande majorité neutres n'a aucune raison de s'afficher
  // comme un vrai 10 : à confiance 100%, aucun effet (x1.0) ; à confiance
  // 0%, le score est divisé par deux (x0.5) plutôt qu'annulé -- une note
  // neutre peut quand même être juste par hasard, mais elle doit être
  // affichée avec prudence, pas avec la même certitude qu'un score mesuré.
  const confidenceFactor = 0.5 + 0.5 * (confidence / 100);
  const total = Math.min(10, rawTotal * confidenceFactor);
  if(confidenceFactor < 1){
    notes.push(`Score ajusté à la confiance : ${round1(rawTotal)}/10 brut -> ${round1(total)}/10 après pénalité de confiance (${confidence}%)`);
  }

  return {
    rarity: round1(scoreRarity), pop: round1(scorePop), demand: round1(scoreDemand),
    liquidity: round1(scoreLiq), timing: round1(scoreTiming),
    total: round1(total), verdict: getVerdict(total), notes,
    confidence, realCount
  };
}

/* ============================================================
   SCAN — TCGdex (api.tcgdex.net, public, sans clé, multilingue)
   Contrairement à l'ancienne source (EN uniquement), TCGdex couvre
   EN / FR / JA nativement -- tu choisis la langue, la recherche se fait
   dans les noms/ids de cette langue, et les prix Cardmarket (EUR) sont
   inclus directement dans chaque carte.
   Limite connue : les sets JP tout juste annoncés (pas encore catalogués
   par la communauté TCGdex) peuvent manquer quelques jours/semaines --
   pour ça, l'onglet "+ Manuel" reste la solution de repli.
   ============================================================ */
const TCGDEX_BASE = "https://api.tcgdex.net/v2";
const currentLang = "fr"; // app simplifiée FR uniquement
let allSetsByLang = {}; // cache par langue

const INTERESTING_RARITIES = [
  "special illustration rare", "illustration rare", "hyper rare",
  "secret rare", "rainbow rare", "gold rare", "ultra rare",
  "shiny ultra rare", "ace spec rare", "amazing rare", "radiant rare",
  "double rare", "black white rare", "art rare", "special art rare",
  "character rare", "character super rare", "trainer gallery rare holo",
  "ar", "sr", "sar", "ur", "ssr", "mur"
];
function isInteresting(rarity){
  if(!rarity) return false;
  const r = rarity.toLowerCase().trim();
  return INTERESTING_RARITIES.some(k => r === k || r.includes(k));
}

async function fetchAllSets(lang, onProgress){
  if(allSetsByLang[lang]) return allSetsByLang[lang];
  const res = await fetch(`${TCGDEX_BASE}/${lang}/sets`);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const brief = await res.json();

  // Le tri par id (texte) ne peut pas donner le bon ordre chronologique
  // entre deux eras différentes (JP "M5" vs "SV11B", FR/EN "Chaos Ascendant"
  // vs "sv10"...). La seule vraie source de date est la fiche DÉTAILLÉE de
  // chaque set (confirmée présente là, contrairement à la liste brève). On
  // la récupère une fois, en parallèle par lots, et on met en cache pour
  // que ce ne soit lent qu'au tout premier chargement de cette langue.
  const batchSize = 15;
  const enriched = [];
  for(let i = 0; i < brief.length; i += batchSize){
    const batch = brief.slice(i, i + batchSize);
    if(onProgress) onProgress(i, brief.length);
    const details = await Promise.all(batch.map(async s => {
      try{
        const r = await fetch(`${TCGDEX_BASE}/${lang}/sets/${s.id}`);
        if(!r.ok) return s;
        const d = await r.json();
        return Object.assign({}, s, { releaseDate: d.releaseDate || null });
      }catch(e){ return s; }
    }));
    enriched.push(...details);
  }

  enriched.sort((a, b) => {
    const ad = a.releaseDate ? new Date(a.releaseDate).getTime() : -Infinity;
    const bd = b.releaseDate ? new Date(b.releaseDate).getTime() : -Infinity;
    if(bd !== ad) return bd - ad;
    return (b.id||"").localeCompare(a.id||""); // égalité/inconnu -> repli texte
  });
  allSetsByLang[lang] = enriched;
  return allSetsByLang[lang];
}

async function searchSets(){
  const q = document.getElementById("set-search").value.trim().toLowerCase();
  const resultsEl = document.getElementById("set-results");
  document.getElementById("scan-results").innerHTML = "";
  resultsEl.innerHTML = `<div class="status-msg">Recherche...</div>`;
  try{
    const sets = await fetchAllSets(currentLang, (done, total) => {
      resultsEl.innerHTML = `<div class="status-msg">Chargement des séries (${done}/${total}, une seule fois)...</div>`;
    });
    let matches;
    if(q){
      const qClean = q.replace(/[\s\-_.]/g, "");
      matches = sets.filter(s => {
        const idL = (s.id||"").toLowerCase();
        return (s.name||"").toLowerCase().includes(q)
          || idL.includes(q)
          || idL.replace(/[\s\-_.]/g, "").includes(qClean);
      });
    } else {
      matches = sets.slice(0, 20);
    }
    if(matches.length === 0){
      resultsEl.innerHTML = `<div class="status-msg">Aucune série trouvée pour "${escapeHtml(q)}".<br><br>Essaie le nom local (ex: "Évolutions Prismées", "sv4a") ou l'id du set. Si une série vient d'être annoncée, elle peut manquer encore quelques jours le temps que la communauté la catalogue -- utilise "+ Manuel" en attendant.</div>`;
      return;
    }
    const logoOrFallback = (s, name) => s.logo
      ? `<img class="set-logo" src="${s.logo}.png" alt="" onerror="this.outerHTML=window.__setFallback('${escapeHtml(name).replace(/'/g,"\\'")}')">`
      : window.__setFallback(name);
    resultsEl.innerHTML = matches.map(s => `
      <div class="set-item" data-id="${s.id}" data-name="${escapeHtml(s.name)}">
        ${logoOrFallback(s, s.name)}
        <div>
          <div class="si-name">${escapeHtml(s.name)}</div>
          <div class="si-meta">${s.releaseDate ? s.releaseDate + " · " : ""}${s.cardCount ? s.cardCount.total + " cartes" : ""} · id: ${escapeHtml(s.id)}</div>
        </div>
      </div>`).join("");
    resultsEl.querySelectorAll(".set-item").forEach(el=>{
      el.addEventListener("click", ()=> scanSet(el.dataset.id, el.dataset.name));
    });
  }catch(err){
    resultsEl.innerHTML = `<div class="status-msg">Connexion à l'API impossible depuis ce navigateur (${escapeHtml(err.message)}). Vérifie ta connexion, ou réessaie dans un instant.</div>`;
  }
}

// Cache partagée : la liste "chase" détaillée d'un set, une fois
// récupérée, sert à la fois au scan direct de ce set ET à toute recherche
// par nom de Pokémon qui croise une carte de ce set. C'est ce qui garantit
// qu'une carte a EXACTEMENT le même score peu importe comment on y arrive
// -- avant, une recherche par nom ne voyait que les autres cartes déjà
// remontées par CETTE recherche, un sous-ensemble différent et arbitraire
// du vrai set, d'où l'incohérence.
const setChaseCardsCache = {};

async function getSetChaseCards(lang, setId, onProgress){
  const cacheKey = `${lang}|${setId}`;
  if(setChaseCardsCache[cacheKey]) return setChaseCardsCache[cacheKey];

  const setRes = await fetch(`${TCGDEX_BASE}/${lang}/sets/${setId}`);
  if(!setRes.ok) { setChaseCardsCache[cacheKey] = []; return []; }
  const setData = await setRes.json();
  const briefCards = setData.cards || [];
  const officialCount = setData.cardCount ? setData.cardCount.official : null;

  let candidates = briefCards;
  if(officialCount){
    const tail = briefCards.filter(c => {
      const num = parseInt(c.localId, 10);
      return !isNaN(num) && num > officialCount;
    });
    if(tail.length > 0) candidates = tail;
  }
  if(candidates.length > 80) candidates = candidates.slice(0, 80);

  const detailed = [];
  const batchSize = 10;
  for(let i = 0; i < candidates.length; i += batchSize){
    const batch = candidates.slice(i, i + batchSize);
    if(onProgress) onProgress(setId, i, candidates.length);
    const results = await Promise.all(batch.map(async c => {
      try{
        const r = await fetch(`${TCGDEX_BASE}/${lang}/cards/${c.id}`);
        if(!r.ok) return null;
        return await r.json();
      }catch(e){ return null; }
    }));
    detailed.push(...results.filter(Boolean));
  }

  setChaseCardsCache[cacheKey] = detailed;
  return detailed;
}

function detailedCardToScoutCard(c, lang, setId, setName){
  const cm = c.pricing && c.pricing.cardmarket ? c.pricing.cardmarket : null;
  const priceNow = cm ? (cm.trend || cm.avg) : null;
  const priceRef = cm ? (cm.avg30 || cm.avg7) : null;
  const priceLow = cm ? cm.low : null;
  const priceAvg1 = cm ? cm.avg1 : null;
  const charInfo = tierForCharacter(c.name);
  const artistInfo = tierForArtist(c.illustrator);
  return {
    source: "api",
    id: "api-" + c.id,
    rawId: c.id,
    name: c.name,
    nameOriginal: null,
    rarityLabel: c.rarity || "",
    market: "FR",
    setCode: c.set ? c.set.id : setId,
    setName: c.set ? c.set.name : (setName || ""),
    image: c.image ? c.image + "/low.webp" : null,
    imageHigh: c.image ? c.image + "/high.webp" : null,
    characterName: charInfo.name, characterTier: charInfo.tier, characterKnown: charInfo.known,
    artistName: artistInfo.name, artistTier: artistInfo.tier, artistKnown: artistInfo.known,
    anniversary: /anniversary|celebrations|25th|30th|151/i.test(setName || (c.set ? c.set.name : "")),
    reprinted: null,
    pullRate: null, psaTotal: null, psa10: null,
    priceNow, price1y: priceRef, priceLow, priceAvg1, priceIsShortTermProxy: true,
    sales90: null,
  };
}

async function searchByPokemon(){
  const name = document.getElementById("pokemon-search").value.trim();
  if(!name) return;
  const resultsEl = document.getElementById("set-results");
  const scanEl = document.getElementById("scan-results");
  resultsEl.innerHTML = "";
  scanEl.innerHTML = `<div class="status-msg">Recherche de "${escapeHtml(name)}" (${currentLang.toUpperCase()})...</div>`;

  try{
    // Syntaxe confirmée par la doc officielle TCGdex : ?name=X fait une
    // recherche "contient" insensible à la casse sur TOUTES les séries.
    const res = await fetch(`${TCGDEX_BASE}/${currentLang}/cards?name=${encodeURIComponent(name)}`);
    if(!res.ok) throw new Error("HTTP " + res.status);
    const brief = await res.json();
    if(!brief || brief.length === 0){
      scanEl.innerHTML = `<div class="status-msg">Aucune carte trouvée pour "${escapeHtml(name)}" en ${currentLang.toUpperCase()}. Essaie le nom local (ex JP en romaji, EN/FR sinon).</div>`;
      return;
    }

    const onlyInteresting = document.getElementById("set-only-interesting").checked;
    const CAP = 70;
    const truncated = brief.length > CAP;
    const candidates = brief.slice(0, CAP);

    scanEl.innerHTML = `<div class="status-msg">Analyse détaillée de ${candidates.length} carte(s)${truncated ? " (limité, "+brief.length+" trouvées au total)" : ""}...</div>`;

    // Étape 1 : identifier rareté + set de chaque carte trouvée (nécessaire
    // pour savoir OÙ aller chercher la vraie cohorte ensuite).
    const detailed = [];
    const batchSize = 10;
    for(let i = 0; i < candidates.length; i += batchSize){
      const batch = candidates.slice(i, i + batchSize);
      const results = await Promise.all(batch.map(async c => {
        try{
          const r = await fetch(`${TCGDEX_BASE}/${currentLang}/cards/${c.id}`);
          if(!r.ok) return null;
          return await r.json();
        }catch(e){ return null; }
      }));
      detailed.push(...results.filter(Boolean));
    }

    let matched = detailed;
    if(onlyInteresting) matched = matched.filter(c => isInteresting(c.rarity));
    if(matched.length === 0){
      scanEl.innerHTML = `<div class="status-msg">Aucune carte ${onlyInteresting ? "de rareté chase " : ""}trouvée pour "${escapeHtml(name)}". Décoche le filtre pour tout voir.</div>`;
      return;
    }

    // Étape 2 : pour CHAQUE set unique concerné, aller chercher sa vraie
    // liste chase complète (même fonction que le scan direct, même cache)
    // -- c'est cette liste qui sert de cohorte, pas juste les cartes qui
    // matchaient la recherche par nom. C'est ce qui garantit un score
    // identique à un scan direct du même set.
    const uniqueSetIds = [...new Set(matched.map(c => c.set ? c.set.id : null).filter(Boolean))];
    scanEl.innerHTML = `<div class="status-msg">Vérification de la cohorte réelle sur ${uniqueSetIds.length} série(s)...</div>`;

    const cohortPool = [];
    for(const setId of uniqueSetIds){
      const setCards = await getSetChaseCards(currentLang, setId, (sid, done, total) => {
        scanEl.innerHTML = `<div class="status-msg">Série ${sid} : ${done}/${total}...</div>`;
      });
      setCards.forEach(c => cohortPool.push(detailedCardToScoutCard(c, currentLang, setId)));
    }
    applyDemandCohorts(cohortPool);

    // Étape 3 : ne garder pour l'affichage QUE les cartes qui matchaient
    // vraiment la recherche par nom, mais avec leur score de cohorte
    // calculé sur la vraie base ci-dessus.
    const byRawId = {};
    cohortPool.forEach(c => { byRawId[c.rawId] = c; });
    const results = matched
      .map(c => byRawId[c.id])
      .filter(Boolean);

    if(results.length === 0){
      scanEl.innerHTML = `<div class="status-msg">Erreur inattendue lors du croisement des données. Réessaie.</div>`;
      return;
    }

    let scored = results.map(c => ({ card:c, result: scoreCard(c) }));
    scored.sort((a,b)=> b.result.total - a.result.total);

    scanEl.innerHTML = `
      <div class="scan-header">
        <div class="sub">${scored.length} carte(s) "${escapeHtml(name)}" — toutes séries (${currentLang.toUpperCase()})</div>
        <button id="btn-rescan">← nouvelle recherche</button>
      </div>
      <div class="status-msg" style="padding:0 0 14px;text-align:left;font-size:11.5px">
        Chaque carte est comparée aux autres de MÊME rareté dans SON PROPRE set (même méthode qu'un scan direct de ce set) --
        le score est donc identique peu importe comment tu es arrivé jusqu'à la carte.
        ${truncated ? ` Limité aux ${CAP} premières correspondances sur ${brief.length} trouvées.` : ""}
      </div>
      ${scored.map(({card,result}, i) => `<div class="li-meta" style="margin:0 0 2px 4px;">${escapeHtml(card.setName)}</div>${renderScanItem(card, result, i+1, scored.length)}`).join("")}
    `;
    document.getElementById("btn-rescan").addEventListener("click", ()=>{
      scanEl.innerHTML = "";
      document.getElementById("pokemon-search").value = "";
    });
    scanEl.querySelectorAll(".btn-save-scan").forEach(b=>{
      b.addEventListener("click", ()=>{
        const card = results.find(c => c.id === b.dataset.id);
        const toSave = Object.assign({}, card, { id: Date.now() + Math.random() });
        delete toSave.source; delete toSave.setName;
        cards.push(toSave);
        saveCards(cards);
        b.textContent = "Ajoutée ✓";
        b.disabled = true;
      });
    });
    scanEl.querySelectorAll(".btn-notes-scan").forEach(b=>{
      b.addEventListener("click", ()=> document.getElementById(b.dataset.target).classList.toggle("open"));
    });
  }catch(err){
    scanEl.innerHTML = `<div class="status-msg">Erreur lors de la recherche (${escapeHtml(err.message)}). Réessaie dans un instant.</div>`;
  }
}

async function scanSet(setId, setName){
  const resultsEl = document.getElementById("set-results");
  const scanEl = document.getElementById("scan-results");
  resultsEl.innerHTML = "";
  scanEl.innerHTML = `<div class="status-msg">Récupération de "${escapeHtml(setName)}"...</div>`;

  try{
    const onlyInteresting = document.getElementById("set-only-interesting").checked;
    let detailed;

    if(onlyInteresting){
      // Passe par la fonction partagée (même cache) que la recherche par
      // Pokémon -- garantit un score identique pour une carte donnée peu
      // importe le chemin utilisé pour l'atteindre.
      detailed = await getSetChaseCards(currentLang, setId, (sid, done, total) => {
        scanEl.innerHTML = `<div class="status-msg">Analyse détaillée ${done}/${total}...</div>`;
      });
    } else {
      // "Tout voir" (checkbox décochée) : hors du cache chase, cas moins
      // fréquent et pas concerné par la cohérence de cohorte (inclut aussi
      // les communes/peu communes qu'on ne compare pas entre elles).
      const setRes = await fetch(`${TCGDEX_BASE}/${currentLang}/sets/${setId}`);
      if(!setRes.ok) throw new Error("HTTP " + setRes.status);
      const setData = await setRes.json();
      const candidates = (setData.cards || []).slice(0, 80);
      scanEl.innerHTML = `<div class="status-msg">Analyse détaillée de ${candidates.length} carte(s)...</div>`;
      detailed = [];
      const batchSize = 10;
      for(let i = 0; i < candidates.length; i += batchSize){
        const batch = candidates.slice(i, i + batchSize);
        const results = await Promise.all(batch.map(async c => {
          try{
            const r = await fetch(`${TCGDEX_BASE}/${currentLang}/cards/${c.id}`);
            if(!r.ok) return null;
            return await r.json();
          }catch(e){ return null; }
        }));
        detailed.push(...results.filter(Boolean));
      }
    }

    let list = detailed;
    if(onlyInteresting) list = list.filter(c => isInteresting(c.rarity));

    if(list.length === 0){
      scanEl.innerHTML = `<div class="status-msg">Aucune carte ${onlyInteresting ? "de rareté chase " : ""}trouvée dans "${escapeHtml(setName)}". Décoche le filtre pour tout voir.</div>`;
      return;
    }

    const results = list.map(c => detailedCardToScoutCard(c, currentLang, setId, setName));
    applyDemandCohorts(results);

    let scored = results.map(c => ({ card:c, result: scoreCard(c) }));
    scored.sort((a,b)=> b.result.total - a.result.total);

    scanEl.innerHTML = `
      <div class="scan-header">
        <div class="sub">${scored.length} carte(s) — ${escapeHtml(setName)}</div>
        <button id="btn-rescan">← autre série</button>
      </div>
      <div class="status-msg" style="padding:0 0 14px;text-align:left;font-size:11.5px">
        Score /10 : <span style="color:var(--good)">≥6.5 intéressant</span> ·
        <span style="color:var(--mid)">5–6.5 neutre</span> ·
        <span style="color:var(--bad)">&lt;5 faible</span>.
        "Demande" compare une carte aux AUTRES de MÊME rareté dans ce scan (pas à tout le set) --
        un Double Rare et un SAR peuvent chacun afficher 10/10 s'ils sont chacun les plus chers de leur propre catégorie.
        C'est le pilier Rareté qui les départage ensuite. Le score final est réduit si la confiance (données réelles vs estimées) est basse.
      </div>
      ${scored.map(({card,result}, i) => renderScanItem(card, result, i+1, scored.length)).join("")}
    `;
    document.getElementById("btn-rescan").addEventListener("click", ()=>{
      scanEl.innerHTML = "";
      document.getElementById("set-search").value = "";
      searchSets();
    });
    scanEl.querySelectorAll(".btn-save-scan").forEach(b=>{
      b.addEventListener("click", ()=>{
        const card = results.find(c => c.id === b.dataset.id);
        const toSave = Object.assign({}, card, { id: Date.now() + Math.random() });
        delete toSave.source; delete toSave.setName;
        cards.push(toSave);
        saveCards(cards);
        b.textContent = "Ajoutée ✓";
        b.disabled = true;
      });
    });
    scanEl.querySelectorAll(".btn-notes-scan").forEach(b=>{
      b.addEventListener("click", ()=> document.getElementById(b.dataset.target).classList.toggle("open"));
    });
  }catch(err){
    scanEl.innerHTML = `<div class="status-msg">Erreur lors du scan (${escapeHtml(err.message)}). Réessaie dans un instant.</div>`;
  }
}

function confidenceBadge(result){
  const cls = result.confidence >= 70 ? "conf-high" : (result.confidence >= 40 ? "conf-mid" : "conf-low");
  return `<div class="confidence-badge ${cls}">Confiance : ${result.confidence}% (${result.realCount}/5 piliers mesurés)</div>`;
}

function targetPriceBlock(card, result){
  const targets = estimateTargetPrices(result.verdict, card.priceNow);
  if(!targets) return "";
  return `<div class="target-price">
    <div style="font-weight:700;margin-bottom:6px;">🎯 Cible de prix (estimation)</div>
    <div style="display:flex;gap:6px;">
      ${targets.map(t => `
        <div style="flex:1;text-align:center;background:var(--panel);border-radius:8px;padding:6px 3px;">

          <div style="font-size:9.5px;color:var(--ink-dim);margin-top:2px;">${t.low}€–${t.high}€</div>
        </div>`).join("")}
    </div>
    <div style="color:var(--ink-dim); font-size:10.5px; margin-top:6px;">Estimation large basée sur les taux d'appréciation moyens du marché Pokémon par palier de score (Card Ladder / PWCC) -- PAS une prédiction fiable pour cette carte précise. La majorité des cartes n'atteignent pas le haut de la fourchette.</div>
  </div>`;
}

function driverLine(result){
  const bars = [["Rareté",result.rarity],["Marché/PSA",result.pop],["Demande (dans sa rareté)",result.demand],["Liquidité (stabilité prix)",result.liquidity],["Timing",result.timing]];
  const sorted = [...bars].sort((a,b)=> b[1]-a[1]);
  const top = sorted[0], bottom = sorted[sorted.length-1];
  if(top[1] - bottom[1] < 3) return ""; // pas assez tranché pour être un vrai "moteur" du score
  return `<div class="driver-line">↑ tiré par : ${top[0]} (${top[1]}/10) · ↓ freiné par : ${bottom[0]} (${bottom[1]}/10)</div>`;
}

            </div>
            <div class="score-badge ${scoreClass}">${result.total}</div>
          </div>
          <div class="verdict">${result.verdict}</div>
          ${driverLine(result)}
          ${confidenceBadge(result)}
          ${targetPriceBlock(card, result)}

window.__setFallback = function(name){
  const letter = (name || "?").trim().charAt(0).toUpperCase() || "?";
  return `<div class="set-logo-fallback">${letter}</div>`;
};
window.__cardFallback = function(name){
  const safe = String(name || "?").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const searchUrl = "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent((name||"") + " pokemon carte");
  return `<a class="card-thumb-fallback" href="${searchUrl}" target="_blank" rel="noopener" title="Chercher l'image sur Google">🎴<br>${safe}</a>`;
};
// Chaîne de secours MULTI-SOURCES (reprise de l'approche qui marchait dans
// le tracker AR-SAR) : TCGdex EN, puis pokemontcg.io (recherche par nom,
// autre base de données indépendante), puis PkmnCards (scans communautaires
// réels), avant de retomber sur le placeholder. Chaque source est
// indépendante -- si l'une n'a pas la carte, une autre peut l'avoir.
window.__cardImgFallback = async function(imgEl, rawId, name){
  const step = parseInt(imgEl.dataset.fallbackStep || "0", 10);

  if(step === 0){
    imgEl.dataset.fallbackStep = "1";
    try{
      const r = await fetch(`${TCGDEX_BASE}/en/cards/${rawId}`);
      if(r.ok){
        const d = await r.json();
        if(d.image){ imgEl.src = d.image + "/low.webp"; imgEl.dataset.full = d.image + "/high.webp"; return; }
      }
    }catch(e){}
  }
  if(step <= 1){
    imgEl.dataset.fallbackStep = "2";
    try{
      const r = await fetch(`https://api.pokemontcg.io/v2/cards?q=${encodeURIComponent('name:"'+name+'"')}&pageSize=1`);
      if(r.ok){
        const d = await r.json();
        const hit = d.data && d.data[0];
        if(hit && hit.images && hit.images.small){
          imgEl.src = hit.images.small; imgEl.dataset.full = hit.images.large || hit.images.small; return;
        }
      }
    }catch(e){}
  }
  imgEl.outerHTML = window.__cardFallback(name);
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
